<!DOCTYPE html>
<html>
<head>
    <title>Upload File</title>
    <style>
        body { font-family: Arial; background: #f0f8ff; margin: 0; }
        .header { background: #343a40; color: white; padding: 15px; text-align: center; }
        .container { max-width: 500px; margin: 50px auto; background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 0 15px rgba(0,0,0,0.2); }
        input[type=file] { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #ccc; }
        button { width: 100%; padding: 10px; background: #17a2b8; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #117a8b; }
        .message { margin: 10px 0; color: green; }
        .footer { text-align: center; margin-top: 15px; font-size: 12px; color: gray; }
        a { color: #ffc107; text-decoration: none; }
    </style>
</head>
<body>
    <div class="header">
        Welcome, {{ username }} | <a href="/logout">Logout</a>
    </div>
    <div class="container">
        <h2>Upload File</h2>
        {% if message %}
            <div class="message">{{ message|safe }}</div>
        {% endif %}
        <form method="POST" enctype="multipart/form-data">
            <input type="file" name="file" required>
            <button type="submit">Upload</button>
        </form>
        <div class="footer"> by Sai</div>
    </div>
</body>
</html>
