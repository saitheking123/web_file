<!DOCTYPE html>
<html>
<head>
    <title>Home - Dashboard</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(120deg, #89f7fe, #66a6ff);
        }
        .header {
            background: #343a40;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 24px;
        }
        .welcome {
            text-align: center;
            margin: 30px 0;
            color: #333;
            font-size: 22px;
        }
        .cards {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .card {
            background: white;
            border-radius: 15px;
            padding: 30px 20px;
            width: 200px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }
        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
        }
        .card a {
            text-decoration: none;
            color: #007BFF;
            font-size: 18px;
            font-weight: bold;
        }
        .footer {
            text-align: center;
            margin: 40px 0 20px 0;
            color: gray;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="header">
        File Manager by techy
    </div>
    <div class="welcome">
        Welcome, {{ username }}!
    </div>
    <div class="cards">
        <div class="card">
            <a href="/upload">Upload Files</a>
        </div>
        <div class="card">
            <a href="/logout">Logout</a>
        </div>
    </div>
    <div class="footer"> by Sai</div>
</body>
</html>
